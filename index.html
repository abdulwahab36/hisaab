<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Hisaab</title>
<meta name="description" content="Personal money, people and recoverables tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" data-act="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Hisaab</h1>
    <button class="icon-btn" id="lockBtn" data-act="lockNow" aria-label="Lock" hidden>
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="nav">
    <button data-act="tab" data-tab="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </button>
    <button data-act="tab" data-tab="people">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 5.5 2 5.5 5"/></svg><span>People</span>
    </button>
    <button data-act="tab" data-tab="add" class="add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-act="tab" data-tab="pending">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Pending</span>
    </button>
    <button data-act="tab" data-tab="more">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>More</span>
    </button>
  </nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="lock" class="lock" hidden>
  <div class="lock-box">
    <h2>Hisaab is locked</h2>
    <p class="muted">Enter your PIN</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="keypad" id="keypad"></div>
    <button class="link" data-act="forgotPin">Forgot PIN?</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="print"></div>

<input type="file" id="fileReceipt" accept="image/*" hidden>
<input type="file" id="fileSnap" accept="image/*" capture="environment" hidden>
<input type="file" id="fileRestore" accept="application/json,.json" hidden>

<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
